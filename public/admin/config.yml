backend:
  name: github
  repo: Gamechanger99/velaro-website
  branch: main

locale: de

# Kein Mediapfad nötig, wir speichern nur Textdaten
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: maerkte
    label: Märkte
    label_singular: Markt
    folder: src/content/maerkte
    create: true
    delete: true
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{fields.name}}"
    summary: "{{fields.name}} – {{fields.datum}}"
    fields:
      - label: Name des Marktes
        name: name
        widget: string
        hint: "z.B. Wochenmarkt Hauptplatz"

      - label: Datum
        name: datum
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        picker_utc: false
        hint: "Datum der Veranstaltung"

      - label: Uhrzeit
        name: uhrzeit
        widget: string
        hint: "z.B. 08:00 - 14:00 Uhr"

      - label: Ort / Veranstaltungsname
        name: ort
        widget: string
        hint: "Kurzname des Ortes, z.B. Hauptplatz Heinsberg"

      - label: Vollständige Adresse
        name: adresse
        widget: string
        hint: "Wird für Google Maps genutzt — z.B. Hauptplatz 1, 52525 Heinsberg"

  - name: speisekarte
    label: Speisekarte
    label_singular: Kategorie
    folder: src/content/speisekarte
    create: false
    delete: false
    format: json
    slug: "{{fields.kategorie}}"
    summary: "{{fields.label}}"
    fields:
      - label: Kategorie-ID
        name: kategorie
        widget: hidden

      - label: Anzeigename
        name: label
        widget: string
        hint: "Wird als Überschrift im Konfigurator angezeigt"

      - label: Gerichte
        name: items
        widget: list
        label_singular: Gericht
        summary: "{{fields.label}}"
        fields:
          - label: Gericht / Name
            name: label
            widget: string
            hint: "Name des Gerichts, z.B. Tomatencremesuppe"

          - label: Unterpunkte (optional)
            name: subs
            widget: list
            required: false
            allow_add: true
            hint: "Z.B. Soßen- oder Beilagenoptionen zum Auswählen. Leer lassen wenn keine Unterpunkte."
            field:
              label: Option
              name: value
              widget: string

          - label: Standard ausgewählt?
            name: default
            widget: boolean
            default: false
            required: false
            hint: "Wenn aktiv, ist dieses Gericht automatisch vorausgewählt (z.B. inklusive Beilagen)"

          - label: Badge-Label
            name: badge
            widget: string
            required: false
            hint: "Optional: z.B. 'Inklusive' oder 'Empfehlung'"
